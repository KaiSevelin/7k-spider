<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7K Spider</title>
    <style>
      /* Tokens, so dark mode is a redefinition rather than a second stylesheet. */
      :root {
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        --bg: #fbfbfa;
        --surface: #ffffff;
        --ink: #1b1b1a;
        --ink-dim: #6b6b67;
        --line: #c9c7c1;
        --accent: #1a5fb4;
        --warn: #b4610a;
        --service: #eef3fb;
        --service-line: #7a9cc6;
        --pipe: #f4f1ea;
        --pipe-line: #b3a98e;
        --port: #fbf3ee;
        --port-line: #c69a7a;
        --package: #f2f1ee;
        --boundary: #c67a3e;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17181a;
          --surface: #202225;
          --ink: #e6e5e2;
          --ink-dim: #9a9892;
          --line: #43454a;
          --accent: #78aeff;
          --warn: #e0923c;
          --service: #1e2733;
          --service-line: #4a6d99;
          --pipe: #262420;
          --pipe-line: #6e6450;
          --port: #2b2320;
          --port-line: #8a6a52;
          --package: #1d1e21;
          --boundary: #c67a3e;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 var(--mono);
        height: 100vh;
        display: grid;
        /* header, graph, timeline. The timeline is a strip rather than a third pane because it is the
           time *control* for the other views, not a peer of them. */
        grid-template-rows: auto 1fr auto;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-top: 1px solid var(--line);
        background: var(--surface);
      }
      footer[hidden] { display: none; }

      footer button {
        font: inherit;
        line-height: 1;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      footer button:hover { border-color: var(--ink-dim); }

      /* Drawn in virtual time, which the transport deliberately does not follow: a thirty-day wait and a
         millisecond must not look the same, and that is the whole point of a timeline. */
      #track {
        position: relative;
        flex: 1;
        height: 18px;
        background: var(--package);
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: pointer;
        overflow: hidden;
      }
      #track .tick {
        position: absolute;
        top: 3px;
        width: 1px;
        height: 12px;
        background: var(--line);
      }
      #track .tick.gap { background: var(--warn); height: 16px; top: 1px; }
      #track .tick.done { background: var(--ink-dim); }
      #playhead {
        position: absolute;
        top: 0;
        width: 2px;
        height: 100%;
        background: var(--accent);
        left: 0;
      }

      #position { color: var(--ink-dim); min-width: 7.5em; text-align: right; }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        flex-wrap: wrap;
      }

      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }

      #status { color: var(--ink-dim); }
      #status.bad { color: var(--warn); }

      label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-dim); }

      /* A focus hides things, so it has to be visible that one is on. */
      #focus {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 4px 1px 7px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        color: var(--accent);
      }
      #focus[hidden] { display: none; }
      #focus b { font-weight: 600; }
      #focusHops { min-width: 1.2em; text-align: center; color: var(--ink-dim); }

      #focus button {
        font: inherit;
        line-height: 1;
        color: var(--accent);
        background: none;
        border: 0;
        padding: 1px 3px;
        cursor: pointer;
        border-radius: 3px;
      }
      #focus button:hover { background: var(--package); }

      header button {
        font: inherit;
        color: var(--ink-dim);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
      }
      header button:hover { color: var(--ink); border-color: var(--ink-dim); }

      /* Over the graph, near the top, where a palette is expected to be. */
      #palette {
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: min(540px, calc(100% - 24px));
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgb(0 0 0 / 22%);
        overflow: hidden;
      }
      #palette[hidden] { display: none; }

      #paletteInput {
        display: block;
        width: 100%;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }
      #paletteInput:focus { outline: none; }

      #paletteList {
        margin: 0;
        padding: 4px;
        list-style: none;
        max-height: 46vh;
        overflow: auto;
      }
      #paletteList li {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      /* Aimed at with the keyboard, so the current row must be unmistakable. */
      #paletteList li[aria-selected="true"] { background: var(--service); }
      #paletteList li .kind {
        flex: 0 0 4.5em;
        color: var(--ink-dim);
        font-size: 11px;
      }
      #paletteList li .name { font-weight: 600; }
      #paletteList li .where { color: var(--ink-dim); font-size: 11px; }
      /* A result the lens or focus has hidden is still worth finding, and worth marking as a dead end. */
      #paletteList li .hiddenMark { color: var(--warn); font-size: 11px; margin-left: auto; }
      #paletteList li.empty { color: var(--ink-dim); cursor: default; }

      select {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
      }

      #sidebar ul { margin: 6px 0 0; padding: 0; list-style: none; }
      #sidebar li { margin: 0; }

      /* A navigator, not a property dump: the graph is bipartite, so getting from one service to
         another is deliberately two hops, and these rows are the second one. */
      #sidebar button {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: var(--accent);
        background: none;
        border: 0;
        border-radius: 3px;
        padding: 2px 4px;
        cursor: pointer;
      }
      #sidebar button:hover { background: var(--package); }
      #sidebar h3 {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-dim);
        margin: 10px 0 2px;
        text-transform: lowercase;
      }

      main { position: relative; min-height: 0; }
      #graph { position: absolute; inset: 0; }

      /* A drawer rather than a pane: the graph is the view you keep, and the sequence is the one you
         open when a trace is the question. It takes the right-hand edge full height, because a sequence
         diagram is long. */
      #sequence {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(620px, 62%);
        overflow: auto;
        background: var(--surface);
        border-left: 1px solid var(--line);
        box-shadow: -6px 0 18px rgb(0 0 0 / 10%);
      }
      #sequence[hidden] { display: none; }

      .sequence { display: block; }
      .sequence .lifeline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
      .sequence .lifeline-pipe { stroke: var(--pipe-line); stroke-dasharray: none; stroke-width: 2; }
      .sequence .lane {
        fill: var(--ink);
        font: 600 11px var(--mono);
        text-anchor: middle;
      }
      .sequence .lane-pipe { fill: var(--pipe-line); }
      .sequence .lane-saga, .sequence .lane-schedule { fill: var(--ink-dim); }
      .sequence .clickable { cursor: pointer; }

      .sequence .band { fill: transparent; }
      .sequence .row.clickable:hover .band { fill: var(--package); }
      .sequence .arrow { stroke: var(--ink-dim); stroke-width: 1.4; }
      .sequence .head { fill: var(--ink-dim); }
      .sequence .mark { fill: var(--ink-dim); }
      .sequence .clock { stroke: var(--line); stroke-dasharray: 2 4; }
      .sequence .label { fill: var(--ink); font: 11px var(--mono); }
      .sequence .label.dim { fill: var(--ink-dim); }
      .sequence .note { fill: var(--ink-dim); font: 10px var(--mono); }

      /* A failure has to read differently from a success here too. */
      .sequence .row.bad .arrow { stroke: var(--warn); }
      .sequence .row.bad .head { fill: var(--warn); }
      .sequence .row.bad .mark { fill: var(--warn); }
      .sequence .row.bad .label { fill: var(--warn); }

      /* A real gap in the clock, with how long it was. */
      .sequence .gap { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 4 3; }
      .sequence .gapLabel { fill: var(--warn); font: 10px var(--mono); text-anchor: end; }

      .sequence .row.dimmed { opacity: 0.25; }
      .sequence .row.emphasised .arrow { stroke: var(--accent); stroke-width: 2.2; }
      .sequence .row.emphasised .head { fill: var(--accent); }
      .sequence .row.emphasised .label { fill: var(--accent); font-weight: 600; }
      /* Where playback has reached. */
      .sequence .row.current .band { fill: var(--service); }

      /* The same drawer shape as the sequence: the graph is the view you keep. */
      #compose {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(520px, 58%);
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-left: 1px solid var(--line);
        box-shadow: -6px 0 18px rgb(0 0 0 / 10%);
      }
      #compose[hidden] { display: none; }

      .panelHead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      .panelHead select { flex: 1; }
      #composeState { color: var(--ink-dim); white-space: nowrap; }
      #composeState.bad { color: var(--warn); }
      #composeState.good { color: var(--accent); }
      .panelHead button {
        font: inherit;
        color: var(--ink-dim);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 2px 5px;
        border-radius: 3px;
      }
      .panelHead button:hover { background: var(--package); }

      #composeForm { flex: 1; overflow: auto; padding: 10px; }
      #composeOut {
        margin: 0;
        max-height: 34%;
        overflow: auto;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink-dim);
        white-space: pre-wrap;
        font: 11px/1.45 var(--mono);
      }

      /* A row per field: label, input, and whatever the model says about it. */
      .f { margin: 0 0 8px; }
      .f > label { display: block; color: var(--ink-dim); margin-bottom: 2px; }
      .f > label .req { color: var(--warn); }
      .f > label .key { color: var(--accent); }
      .f input[type="text"], .f input[type="number"], .f textarea, .f select {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 6px;
      }
      .f textarea { min-height: 3.4em; resize: vertical; }
      .f .hint { color: var(--ink-dim); font-size: 10px; }
      /* What the contract says is wrong, beside the field it is wrong about. */
      .f .bad { color: var(--warn); font-size: 10px; }
      .f.invalid input, .f.invalid textarea, .f.invalid select { border-color: var(--warn); }

      /* A nested record, indented under its own heading rather than flattened away. */
      .group { border-left: 2px solid var(--line); padding-left: 8px; margin: 0 0 8px; }
      .group > .groupName { color: var(--ink); font-weight: 600; margin-bottom: 4px; }
      .listItem { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
      .listItem > div { flex: 1; }
      .rowBtn {
        font: inherit;
        color: var(--ink-dim);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
        padding: 1px 7px;
      }
      .rowBtn:hover { color: var(--ink); }
      .unknownField { color: var(--warn); font-size: 11px; }

      #sidebar {
        position: absolute;
        top: 12px;
        right: 12px;
        width: min(340px, calc(100% - 24px));
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        display: none;
      }
      #sidebar.open { display: block; }
      /* Out of the drawer's way, since both live on the right. */
      body.sequence-open #sidebar { right: calc(min(620px, 62%) + 12px); }
      body.compose-open #sidebar { right: calc(min(520px, 58%) + 12px); }
      #sidebar h2 { font-size: 13px; margin: 0 0 8px; word-break: break-all; }
      #sidebar dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
      #sidebar dt { color: var(--ink-dim); }
      #sidebar dd { margin: 0; word-break: break-all; }

      /* A proposal, shown before anything is written. Section 7 of 20-ir.md: a caller gets the edits and
         the diagnostics so it can preview — an editor that wrote the file the instant two nodes were
         clicked would be one you stop clicking in. */
      #propose {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(600px, calc(100% - 24px));
        max-height: 76%;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 8px;
        box-shadow: 0 10px 34px rgb(0 0 0 / 26%);
      }
      #propose[hidden] { display: none; }
      #proposeBody { flex: 1; overflow: auto; padding: 10px 12px; }

      .panelFoot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
      }
      #proposeState { flex: 1; color: var(--ink-dim); }
      #proposeState.bad { color: var(--warn); }
      #proposeApply {
        font: inherit;
        color: var(--surface);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 3px 12px;
        cursor: pointer;
      }
      #proposeApply[disabled] { opacity: 0.45; cursor: default; }

      /* The clause that will be written, as it will be written. */
      #proposeBody pre {
        margin: 6px 0 0;
        padding: 8px 10px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        white-space: pre-wrap;
        font: 11px/1.5 var(--mono);
      }
      #proposeBody pre.removing { border-color: var(--warn); color: var(--warn); }
      #proposeBody .where { color: var(--ink-dim); font-size: 11px; }
      #proposeBody .why { color: var(--warn); margin-top: 6px; }
      #proposeBody ul { margin: 4px 0 0; padding: 0; list-style: none; max-height: 34vh; overflow: auto; }
      #proposeBody li button {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: var(--ink);
        background: none;
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 3px 6px;
        cursor: pointer;
      }
      #proposeBody li button:hover { background: var(--package); }
      #proposeBody li button .onPipe { color: var(--ink-dim); font-size: 10px; margin-left: 6px; }

      /* While a connection is being made, the nodes that could be its other end stand out. */
      body.connecting #graph { cursor: crosshair; }
      #connect.armed { color: var(--accent); border-color: var(--accent); }

      /* Opened on demand. Six warnings on a clean model meant this used to float over the graph
         permanently, competing with the sidebar; honesty needs a count you cannot miss, not a panel
         you cannot close. */
      #problems {
        position: absolute;
        bottom: 12px;
        left: 12px;
        max-width: min(620px, calc(100% - 24px));
        max-height: 40%;
        overflow: auto;
        padding: 10px 30px 10px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        display: none;
      }
      #problems.open { display: block; }
      #problemsText {
        margin: 0;
        white-space: pre-wrap;
        font: inherit;
        color: var(--ink-dim);
      }
      #problemsClose {
        position: absolute;
        top: 4px;
        right: 6px;
        font: inherit;
        color: var(--ink-dim);
        background: none;
        border: 0;
        cursor: pointer;
        padding: 2px 5px;
        border-radius: 3px;
      }
      #problemsClose:hover { background: var(--package); }

      /* An error is a different kind of news from a warning, and the button says which. */
      #problemsCount.errors { color: var(--warn); border-color: var(--warn); }
      #problemsCount.clean { color: var(--ink-dim); }

      @media (max-width: 640px) {
        #sidebar { position: static; width: auto; margin: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>7K Spider</h1>
      <button type="button" id="find" title="find anything (Ctrl-K)">find&hellip;</button>
      <button type="button" id="problemsCount" title="what the checker says"></button>
      <button type="button" id="toggleSequence" title="the sequence diagram (s)" hidden>
        sequence
      </button>
      <button type="button" id="toggleCompose" title="build a message (c)">compose</button>
      <button type="button" id="connect" title="connect two things (n)">connect&hellip;</button>
      <span id="status">loading…</span>
      <span id="focus" hidden>
        focus <b id="focusName"></b>
        <button type="button" id="focusOut" title="fewer hops">&minus;</button><span
          id="focusHops"
        ></span><button type="button" id="focusIn" title="more hops">+</button>
        <button type="button" id="focusClear" title="clear the focus (Esc)">&times;</button>
      </span>
      <label for="lens">lens</label>
      <select id="lens"></select>
      <label><input type="checkbox" id="packages" checked /> packages</label>
      <label><input type="checkbox" id="dead" /> dead letters</label>
    </header>
    <main>
      <div id="graph"></div>

      <div id="palette" hidden>
        <input
          id="paletteInput"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="find a service, pipe, message&hellip;  (try: pipes)"
        />
        <ul id="paletteList"></ul>
      </div>
      <aside id="sequence" hidden></aside>
      <aside id="compose" hidden>
        <header class="panelHead">
          <select id="composeWhat" title="what to build"></select>
          <span id="composeState"></span>
          <button type="button" id="composeClose" title="close">&times;</button>
        </header>
        <div id="composeForm"></div>
        <pre id="composeOut"></pre>
      </aside>
      <aside id="sidebar"></aside>
      <div id="propose" hidden>
        <header class="panelHead">
          <b id="proposeWhat"></b>
          <button type="button" id="proposeClose" title="cancel (Esc)">&times;</button>
        </header>
        <div id="proposeBody"></div>
        <footer class="panelFoot">
          <span id="proposeState"></span>
          <button type="button" id="proposeApply">write it</button>
        </footer>
      </div>

      <div id="problems">
        <button type="button" id="problemsClose" title="close">&times;</button>
        <pre id="problemsText"></pre>
      </div>
    </main>
    <footer id="timeline" hidden>
      <select id="run" title="which run" hidden></select>
      <button type="button" id="playPause" title="play or pause (Space)">&#9654;</button>
      <button type="button" id="stepBack" title="previous event (&larr;)">&#8249;</button>
      <button type="button" id="stepOn" title="next event (&rarr;)">&#8250;</button>
      <div id="track" title="click to seek"><div id="playhead"></div></div>
      <span id="position"></span>
      <select id="speed" title="playback speed">
        <option value="0.5">0.5&times;</option>
        <option value="1" selected>1&times;</option>
        <option value="2">2&times;</option>
        <option value="4">4&times;</option>
        <option value="8">8&times;</option>
      </select>
    </footer>
    <script src="/bundle.js"></script>
  </body>
</html>
