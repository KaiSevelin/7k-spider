name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Spider depends on a sibling checkout of the language repository while Core's shape is
      # still settling. A published dependency replaces this once it stops moving.
      - uses: actions/checkout@v4
        with:
          repository: KaiSevelin/7k
          path: 7K
      - uses: actions/checkout@v4
        with:
          path: 7k-spider
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: 7K
      - run: npm install
        working-directory: 7k-spider
      - run: npm run typecheck
        working-directory: 7k-spider
      - run: npm test
        working-directory: 7k-spider
